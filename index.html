<style>
/* Layout: banda de cordillera arriba, secciones en columna; vino del logo parroquial + azul andino. Panel de edición como cajón lateral. */
:root{
  --bg:#f6f7f8; --surface:#ffffff; --ink:#26201d; --muted:#655c57; --line:#dddcd9;
  --wine:#8a2a2c; --sky:#3d6987; --sky-soft:#e4ebf1; --gold:#a07a2e; --snow:#ffffff; --ok:#2f7a4f; --bad:#b3261e;
  --display:"Marcellus","Trajan Pro",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141719; --surface:#1c2023; --ink:#ece7e2; --muted:#a8a09a; --line:#31363a;
  --wine:#e08f8c; --sky:#8fb5d2; --sky-soft:#1f2a33; --gold:#d6b26a; --snow:#e9eef2; --ok:#7cc79a; --bad:#f2948d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141719; --surface:#1c2023; --ink:#ece7e2; --muted:#a8a09a; --line:#31363a;
  --wine:#e08f8c; --sky:#8fb5d2; --sky-soft:#1f2a33; --gold:#d6b26a; --snow:#e9eef2; --ok:#7cc79a; --bad:#f2948d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6}
a{color:var(--sky)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;line-height:1.2;margin:0}
h2{font-size:clamp(1.6rem,3vw,2.1rem);color:var(--wine)}
h3{font-size:1.2rem}
p{margin:0}
.eyebrow{font-family:var(--ui);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

.tpl{background:var(--sky-soft);font-family:var(--ui);font-size:.85rem}
.tpl .wrap{padding-block:.55rem}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.7rem;position:relative}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--ink);min-width:0}
.brand .logo{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;background:var(--surface);border:1px solid var(--line)}
.brand b{font-family:var(--display);font-weight:400;font-size:1.02rem;line-height:1.15;display:block}
.brand small{font-family:var(--ui);font-size:.75rem;color:var(--muted)}
nav.menu{display:flex;gap:1.1rem;font-family:var(--ui);font-size:.9rem;font-weight:500}
nav.menu a{color:var(--ink);text-decoration:none;padding:.3rem 0;border-bottom:2px solid transparent}
nav.menu a:hover{border-color:var(--gold)}
.menu-btn{display:none;font-family:var(--ui);background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:.4rem .7rem;font-size:.9rem;cursor:pointer}
@media (max-width:900px){
  .menu-btn{display:block}
  nav.menu{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);flex-direction:column;gap:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.4rem}
  nav.menu.open{display:flex}
  nav.menu a{padding:.65rem 0;border-bottom:1px solid var(--line)}
  nav.menu a:last-child{border-bottom:0}
}

.hero{position:relative;overflow:hidden;background:#2b201c}
.hero-slides{position:absolute;inset:0;z-index:0}
.hero-slides div{position:absolute;inset:0;background-position:center 58%;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity 1.4s ease}
.hero-slides div.on{opacity:1}
@media (prefers-reduced-motion:reduce){.hero-slides div{transition:none}}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(22,15,13,.86) 0%,rgba(22,15,13,.62) 45%,rgba(22,15,13,.12) 100%)}
@media (max-width:700px){.hero-slides div{background-position:30% 60%}.hero::before{background:linear-gradient(180deg,rgba(22,15,13,.55) 0%,rgba(22,15,13,.85) 100%)}}
.hero .eyebrow{color:#eadfd8}
.hero .btn:not(.solid){color:#fff;border-color:rgba(255,255,255,.75)}
.hero .btn:not(.solid):hover{background:rgba(255,255,255,.12)}
.hero .btn.solid{background:#9a2f31;border-color:#9a2f31;color:#fff}
.hero .wrap{position:relative;z-index:2;padding-block:4.5rem 9.5rem;display:grid;gap:1rem}
.hero h1{font-size:clamp(2rem,5.6vw,3.4rem);color:#fff;max-width:18ch;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.hero .lead{font-size:1.15rem;max-width:52ch;color:#f4ece7}
.hero .quote{font-style:italic;color:#e3d5cd}
.cta{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.6rem}
.btn{font-family:var(--ui);font-weight:600;font-size:.92rem;text-decoration:none;padding:.65rem 1.05rem;border-radius:6px;border:1px solid var(--wine);color:var(--wine);background:transparent;cursor:pointer;display:inline-block}
.btn.solid{background:var(--wine);color:var(--bg)}
.btn.small{padding:.4rem .7rem;font-size:.82rem}
.ridge{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:110px;display:block;z-index:2}

.next{margin-top:-2.6rem;position:relative;z-index:2}
.next .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.3rem;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.5rem;box-shadow:0 6px 24px rgba(30,25,20,.08)}
.next .big{font-family:var(--display);font-size:1.6rem;color:var(--wine);font-variant-numeric:tabular-nums}
.next .note{font-family:var(--ui);font-size:.85rem;color:var(--muted)}

main section{padding-block:3.4rem;border-bottom:1px solid var(--line)}
section[id]{scroll-margin-top:5rem}
.sec-head{display:grid;gap:.4rem;margin-bottom:1.6rem;max-width:62ch}
.sec-head p{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1.6rem}
.grid2 > *{min-width:0}

.sched{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:.95rem;font-variant-numeric:tabular-nums}
.sched th,.sched td{text-align:left;padding:.65rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
.sched th{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sched td:first-child{font-weight:600;white-space:nowrap}
.sched tr.today td{background:var(--sky-soft)}
.sched tr.cont td{border-top:0;padding-top:.15rem}
.sched tr:has(+ tr.cont) td:not([rowspan]){border-bottom:0;padding-bottom:.15rem}
.sched td[rowspan]{border-bottom:1px solid var(--line)}
.sched tr.today td[rowspan]::after{content:" · hoy";color:var(--sky);font-weight:500}
.sched .nota{display:block;color:var(--muted);font-size:.85rem}
.tablebox{overflow-x:auto}
.side{display:grid;gap:1.2rem;align-content:start}
.side .block{border-left:3px solid var(--gold);padding-left:1rem;display:grid;gap:.25rem}
.side .block h3{color:var(--wine)}
.side .block p{font-family:var(--ui);font-size:.95rem}
.side .block p.sub{color:var(--muted)}

.pastoral{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:1.2rem 2rem}
.pastoral article{display:grid;gap:.3rem;padding-top:1rem;border-top:2px solid var(--wine)}
.pastoral p{color:var(--muted);font-size:.98rem}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:1.4rem}
.person{display:grid;gap:.35rem;align-content:start}
.portrait{aspect-ratio:4/5;max-width:100%;width:100%;border-radius:8px;background:var(--sky-soft);display:grid;place-items:center;color:var(--muted);object-fit:cover}
.person .role{font-family:var(--ui);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
.person h3{font-size:1.15rem}
.person p{font-size:.95rem;color:var(--muted)}

.sacr{display:grid;grid-template-columns:1fr;column-gap:2.5rem;border-top:1px solid var(--line)}
@media (min-width:700px){.sacr{grid-template-columns:1fr 1fr}}
.sacr details{border-bottom:1px solid var(--line);padding:.9rem .2rem}
.sacr summary{cursor:pointer;font-family:var(--display);font-size:1.15rem;list-style:none;display:flex;justify-content:space-between;gap:1rem}
.sacr summary::-webkit-details-marker{display:none}
.sacr summary::after{content:"+";font-family:var(--ui);color:var(--gold)}
.sacr details[open] summary::after{content:"–"}
.sacr .req-sub{font-family:var(--ui);font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-top:.8rem}
.sacr ul{margin:.4rem 0 0;padding-left:1.1rem;font-family:var(--ui);font-size:.92rem;color:var(--muted);display:grid;gap:.2rem}

.news article{display:grid;grid-template-columns:6rem 1fr;gap:1rem;padding-block:1rem;border-bottom:1px solid var(--line)}
.news article > div{min-width:0}
.news time .nota{display:block;font-weight:500;color:var(--muted)}
.news .pmore{font-family:var(--ui);font-size:.85rem;font-weight:600;color:var(--sky);text-decoration:none}
.news time{font-family:var(--ui);font-size:.85rem;color:var(--sky);font-weight:600;font-variant-numeric:tabular-nums}
.news h3{font-size:1.1rem;margin-bottom:.2rem}
.news p{font-size:.95rem;color:var(--muted);white-space:pre-line}
.empty{font-family:var(--ui);color:var(--muted);font-size:.95rem}

.mapcard{background:var(--sky-soft);border-radius:10px;padding:1.4rem;display:grid;gap:.8rem;align-content:start}
.gmap{width:100%;max-width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--surface)}
.gmap iframe{width:100%;height:100%;border:0;display:block}
.addr{font-family:var(--display);font-size:1.3rem}

.channel{display:grid;grid-template-columns:2.4rem 1fr auto;gap:.8rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}
.channel .ic{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--sky-soft);display:grid;place-items:center;color:var(--sky)}
.channel .lbl{font-family:var(--ui);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.channel .val{font-family:var(--ui);font-size:1rem;word-break:break-word;user-select:all}
.channel > div{min-width:0}
.copy{font-family:var(--ui);font-size:.8rem;background:none;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:.3rem .6rem;cursor:pointer}
form.msg{display:grid;gap:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.3rem}
form.msg label{font-family:var(--ui);font-size:.85rem;font-weight:600;display:grid;gap:.3rem}
form.msg input,form.msg textarea,form.msg select{font:400 .95rem var(--ui);padding:.6rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
form.msg textarea{min-height:7rem;resize:vertical}
.ok{font-family:var(--ui);font-size:.9rem;color:var(--sky)}

.socials{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1rem}
.social{display:flex;align-items:center;gap:.8rem;text-decoration:none;color:var(--ink);padding:1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.social:hover{border-color:var(--wine)}
.social svg{flex:none;color:var(--wine)}
.social div{min-width:0}
.social b{font-family:var(--ui);font-weight:600;display:block}
.social span{font-family:var(--ui);font-size:.85rem;color:var(--muted);display:block;overflow-wrap:anywhere}

footer{padding-block:2.5rem;font-family:var(--ui);font-size:.88rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;align-items:end}
footer .name{font-family:var(--display);font-size:1.05rem;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.gospel-band{background:var(--surface)}
.gospel{display:grid;gap:.7rem;max-width:calc(62ch + 32px)}
#ev-cita{font-size:clamp(1.9rem,4.5vw,2.7rem)}
.ev-cel{font-family:var(--ui);font-size:.95rem;color:var(--muted);display:flex;align-items:center;gap:.5rem}
.ev-dot{width:.8rem;height:.8rem;border-radius:50%;border:1px solid var(--line);flex:none}
.ev-res{font-size:1.1rem}
.ev-src{font-family:var(--ui);font-size:.8rem;color:var(--muted)}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:1.2rem}
.post{display:grid;grid-template-rows:auto 1fr;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.post:hover{border-color:var(--wine)}
.post .pimg{aspect-ratio:1/1;width:100%;max-width:100%;object-fit:cover;display:block;background:var(--sky-soft)}
.post .pph{aspect-ratio:3/1;display:grid;place-items:center;background:var(--sky-soft);color:var(--wine)}
.post .pbody{padding:.9rem 1rem;display:grid;gap:.4rem;align-content:start}
.post .pmeta{font-family:var(--ui);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.post p{font-size:.95rem}
.post .pmore{font-family:var(--ui);font-size:.85rem;color:var(--sky);font-weight:600}
#fbPlugin{overflow:hidden;min-height:200px}
.feeds{display:block}
.feeds > *{min-width:0}
.feed h4{margin:0 0 .8rem;font-weight:600}
.posts.four{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.pcap{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.don-band{background:var(--sky-soft)}
.don{display:grid;gap:.9rem;justify-items:start}
.don-btn{font-size:1.05rem;padding:.85rem 1.4rem}
.don-note{font-family:var(--ui);font-size:.82rem;color:var(--muted)}
.val a{color:var(--sky)}

/* Columna fija de publicaciones */
.layout{display:flex;flex-direction:column}
.layout > main{min-width:0}
.feed-side{order:-1;border-bottom:1px solid var(--line);background:var(--surface)}
.feed-in{padding-block:1.4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:.6rem}
.feed-in h3{font-size:1.25rem;color:var(--wine)}
.posts.side{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,62%);overflow-x:auto;gap:.9rem;padding-bottom:.4rem;scroll-snap-type:x mandatory}
.posts.side .post{scroll-snap-align:start}
.posts.side .pimg{aspect-ratio:4/3}
.posts.side .pcap{-webkit-line-clamp:3;font-size:.9rem}
@media (min-width:1100px){
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;max-width:1440px;margin:0 auto;align-items:start}
  .feed-side{order:0;grid-column:2;grid-row:1;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 92px);overflow-y:auto;border-bottom:0;border-left:1px solid var(--line);background:var(--bg)}
  .feed-in{padding:1.4rem 1.2rem}
  .posts.side{grid-auto-flow:row;grid-auto-columns:auto;overflow:visible}
  .layout > main{grid-column:1;grid-row:1}
}
/* ===== Panel de administración ===== */
.admin-fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;font-family:var(--ui);font-weight:600;font-size:.9rem;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:.7rem 1.1rem;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:30;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;font-family:var(--ui);font-size:.92rem;box-shadow:-10px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:1rem 1.1rem;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:1.25rem;color:var(--ink)}
.tabs{display:flex;gap:.3rem;overflow-x:auto;padding:.6rem 1.1rem;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:none;font:500 .82rem var(--ui);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:.35rem .75rem;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--wine);border-color:var(--wine);color:var(--bg)}
.ed-body{flex:1;overflow-y:auto;padding:1rem 1.1rem;display:grid;gap:.9rem;align-content:start}
.ed-body .help{color:var(--muted);font-size:.85rem}
.fld{display:grid;gap:.3rem}
.fld > span{font-weight:600;font-size:.82rem}
.fld input,.fld textarea,.fld select{font:400 .92rem var(--ui);padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.fld textarea{min-height:4.5rem;resize:vertical}
.item{border:1px solid var(--line);border-radius:8px;padding:.8rem;display:grid;gap:.6rem;background:var(--bg)}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem}

  body.appendChild(el('p','help','Estas fotos se muestran en la portada y cambian cada 10 segundos, en este orden. Usa fotos horizontales. Después de agregar, quitar u ordenar, presiona Publicar cambios.'));
  arr.forEach(function(x,idx){var it=el('div','item');var hd=el('div','item-head');var th=el('img','thumb');th.src=PREV[x.src]||x.src;th.alt='';th.style.width='96px';th.style.height='64px';hd.appendChild(th);
    var tools=el('div','item-tools');
    var up=el('button','iconbtn','↑ Subir');up.type='button';up.disabled=idx===0;up.onclick=function(){arr.splice(idx-1,0,arr.splice(idx,1)[0]);changed();buildForm()};
    var del=el('button','iconbtn danger','Quitar');del.type='button';del.disabled=arr.length===1;del.title=arr.length===1?'Debe quedar al menos una foto':'';del.onclick=function(){arr.splice(idx,1);changed();buildForm()};
    tools.appendChild(up);tools.appendChild(del);hd.appendChild(tools);it.appendChild(hd);
    it.appendChild(field('Encuadre (opcional): parte de la foto que se mantiene visible','ed-pos-'+idx,'select',x.pos||'center 58%',function(v){x.pos=v;slideKey='';changed()},['center 58%','center top','center center','center bottom','left center','right center']));
    body.appendChild(it)});
  var w=el('label','fld');w.htmlFor='ed-addfotos';w.appendChild(el('span',null,'Agregar fotos'));var inp=el('input');inp.type='file';inp.accept='image/*';inp.multiple=true;inp.id='ed-addfotos';w.appendChild(inp);body.appendChild(w);
  inp.onchange=function(){var files=[].slice.call(inp.files||[]);if(!files.length)return;inp.disabled=true;var n=0;
    var next=function(){if(n>=files.length){inp.disabled=false;inp.value='';changed();buildForm();status(files.length===1?'Foto agregada. Presiona Publicar cambios para que se vea en el sitio.':'Fotos agregadas. Presiona Publicar cambios para que se vean en el sitio.','ok');return}
      var f=files[n++];status('Subiendo foto '+n+' de '+files.length+'…','');
      fotoGrande(f,function(url){var path='fotos/portada-'+Date.now()+'-'+n+'.jpg';
        putB64(path,url.split(',')[1],'Agrega foto de portada').then(function(){PREV[path]=url;arr.push({src:path});next()},function(e){inp.disabled=false;if(e&&e.auth){setTok('');showLogin('La clave venció o no tiene permiso.')}else status('No se pudo subir la foto '+n+'. Inténtalo de nuevo.','bad')})},
        function(){status('El archivo '+f.name+' no es una imagen válida.','bad');next()})};
    next()}}
function putFile(path,text,msg){return gh('/contents/'+path+'?ref=main').then(function(r){if(r.status===401||r.status===403)throw{auth:1};return r.ok?r.json():{}}).then(function(cur){
  return gh('/contents/'+path,{method:'PUT',body:JSON.stringify({message:msg,content:b64(text),sha:cur.sha,branch:'main'})})}).then(function(r){if(r.status===401||r.status===403)throw{auth:1};if(!r.ok)throw{code:r.status};return r})}

function showLogin(msg){var d=$('drawer');
  d.innerHTML='<div class="drawer-head"><h2>Administrar sitio</h2><button class="iconbtn" type="button" id="ed-close">Cerrar</button></div>'
   +'<form class="ed-body login" id="loginForm"><p>Ingresa con tu usuario y contraseña.</p>'
   +'<label class="fld" for="lg-user"><span>Usuario</span><input id="lg-user" autocomplete="username" autocapitalize="none" required></label>'
   +'<label class="fld" for="lg-pass"><span>Contraseña</span><input id="lg-pass" type="password" autocomplete="current-password" required></label>'
   +'<button class="btn solid" type="submit" id="lg-btn">Entrar</button><p class="status" id="ed-status"></p></form>'
   +'<form class="ed-body login" id="tokForm" style="border-top:1px solid var(--line)"><b>Entrar con la clave de GitHub</b><p class="help">Úsala la primera vez, o si olvidaste tu contraseña. Empieza con github_pat_.</p>'
   +'<label class="fld" for="tok"><span>Clave de GitHub</span><input id="tok" type="password" autocomplete="off" required></label><button class="btn small" type="submit" id="tok-btn">Entrar con clave</button><p class="status" id="tok-status"></p></form>';
  $('ed-close').onclick=closeEditor;if(msg)status(msg,'bad');
  $('loginForm').onsubmit=function(e){e.preventDefault();var u=$('lg-user').value.trim().toLowerCase(),pw=$('lg-pass').value,btn=$('lg-btn');btn.disabled=true;status('Verificando…','');
    loadUsers().then(function(db){var rec=(db.usuarios||[]).filter(function(x){return x.usuario===u})[0];if(!rec)throw{bad:1};
      return decryptTok(pw,rec).catch(function(){throw{bad:1}})}).then(function(tok){setTok(tok);return checkTok()}).then(function(ok){btn.disabled=false;
      if(ok)showEditor();else{setTok('');status('Tu acceso ya no es válido: la clave de GitHub cambió. Entra con la clave nueva y vuelve a crear tu contraseña.','bad')}
    }).catch(function(e){btn.disabled=false;setTok('');status(e&&e.bad?'Usuario o contraseña incorrectos.':'No hay conexión. Revisa tu internet.','bad')})};
  $('tokForm').onsubmit=function(e){e.preventDefault();var ts=$('tok-status');var say=function(t,c){ts.textContent=t;ts.className='status'+(c?' '+c:'')};
    var t=$('tok').value.replace(/\s+/g,'');if(!/^(github_pat_|ghp_)/.test(t))return say('La clave debe empezar con github_pat_. Revisa que la copiaste completa.','bad');
    setTok(t);say('Verificando…','');
    gh('').then(function(r){if(r.status===401)return 'invalid';return r.ok?r.json():'noaccess'}).then(function(j){
      if(j&&j.permissions&&j.permissions.push){current='usuarios';showEditor();status('Ahora crea tu usuario y contraseña.','')}
      else{setTok('');say(j==='invalid'?'GitHub rechazó la clave: puede ser una clave anterior (si la regeneraste, la vieja deja de servir) o estar incompleta.':'La clave no tiene permiso para editar este sitio.','bad')}
    },function(){setTok('');say('No hay conexión con GitHub. Revisa tu internet.','bad')})}}

function buildUsers(body){
  body.appendChild(el('p','help','Crea un usuario y una contraseña para entrar al panel sin la clave de GitHub. Usa una contraseña de al menos 10 caracteres. Si cambias la clave de GitHub, hay que volver a crear los usuarios.'));
  var list=el('div');list.style.cssText='display:grid;gap:.5rem';body.appendChild(list);
  function refresh(){list.textContent='Cargando…';loadUsers().then(function(db){list.textContent='';var us=db.usuarios||[];
    if(!us.length)list.appendChild(el('p','help','Todavía no hay usuarios creados.'));
    us.forEach(function(x){var it=el('div','item');var hd=el('div','item-head');hd.appendChild(el('b',null,x.usuario));var del=el('button','iconbtn danger','Quitar');del.type='button';
      del.onclick=function(){del.disabled=true;var rest=us.filter(function(y){return y.usuario!==x.usuario});
        putFile('usuarios.json',JSON.stringify({usuarios:rest},null,1),'Quita usuario '+x.usuario).then(function(){status('Usuario quitado.','ok');setTimeout(refresh,1500)},fail)};
      hd.appendChild(del);it.appendChild(hd);list.appendChild(it)})})}
  function fail(e){if(e&&e.auth){setTok('');showLogin('La clave venció o no tiene permiso.')}else status('No se pudo guardar. Inténtalo de nuevo.','bad')}
  var f=el('div','item');f.appendChild(el('b',null,'Nuevo usuario o cambio de contraseña'));
  var iu=field('Usuario (sin espacios)','us-user','','',function(){});var ip=field('Contraseña','us-pass','','',function(){});var ip2=field('Repite la contraseña','us-pass2','','',function(){});
  ip.querySelector('input').type='password';ip2.querySelector('input').type='password';ip.querySelector('input').autocomplete='new-password';ip2.querySelector('input').autocomplete='new-password';
  f.appendChild(iu);f.appendChild(ip);f.appendChild(ip2);
  var go=el('button','btn small solid','Guardar usuario');go.type='button';f.appendChild(go);body.appendChild(f);
  go.onclick=function(){var u=$('us-user').value.trim().toLowerCase(),p1=$('us-pass').value,p2=$('us-pass2').value;
    if(!/^[a-z0-9._-]{3,30}$/.test(u))return status('El usuario debe tener entre 3 y 30 letras o números, sin espacios.','bad');
    if(p1.length<10)return status('La contraseña debe tener al menos 10 caracteres.','bad');
    if(p1!==p2)return status('Las contraseñas no coinciden.','bad');
    go.disabled=true;status('Guardando…','');
    Promise.all([loadUsers(),encryptTok(p1,getTok())]).then(function(r){var us=(r[0].usuarios||[]).filter(function(y){return y.usuario!==u});var rec=r[1];rec.usuario=u;us.push(rec);
      return putFile('usuarios.json',JSON.stringify({usuarios:us},null,1),'Guarda usuario '+u)}).then(function(){go.disabled=false;$('us-pass').value='';$('us-pass2').value='';
      status('Usuario "'+u+'" guardado. Podrás entrar con él en uno o dos minutos.','ok');setTimeout(refresh,1500)},function(e){go.disabled=false;fail(e)})};
  refresh()}
function showEditor(){if(!draft)draft=JSON.parse(JSON.stringify(DATA));var d=$('drawer');
  d.innerHTML='<div class="drawer-head"><h2>Administrar sitio</h2><span style="display:flex;gap:.4rem"><button class="iconbtn" type="button" id="ed-logout">Salir</button><button class="iconbtn" type="button" id="ed-close">Cerrar</button></span></div><div class="tabs" id="ed-tabs" role="tablist"></div><div class="ed-body" id="ed-body"></div><div class="drawer-foot"><span class="status" id="ed-status">Los cambios se ven al instante en esta pantalla.</span><span style="display:flex;gap:.5rem"><button class="btn small" type="button" id="ed-discard">Descartar</button><button class="btn small solid" type="button" id="ed-save">Publicar cambios</button></span></div>';
  buildTabs();buildForm();
  $('ed-close').onclick=closeEditor;$('ed-logout').onclick=function(){setTok('');showLogin()};if(current==='usuarios')status('Crea aquí tu usuario y contraseña.','');
  $('ed-discard').onclick=function(){draft=JSON.parse(JSON.stringify(DATA));dirty=false;render(DATA);buildForm();status('Cambios descartados','')};
  $('ed-save').onclick=save}
function closeEditor(){var d=$('drawer');if(d)d.remove();document.body.classList.remove('editing');if(dirty){draft=null;dirty=false;render(DATA)}}
function b64(str){var bytes=new TextEncoder().encode(str),bin='';for(var i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(bin)}
function save(){var b=$('ed-save');b.disabled=true;status('Publicando…','');
  gh('/contents/data.json?ref=main').then(function(r){if(r.status===401||r.status===403)throw{auth:1};return r.ok?r.json():{}}).then(function(cur){
    return gh('/contents/data.json',{method:'PUT',body:JSON.stringify({message:'Actualiza contenido desde el panel',content:b64(JSON.stringify(draft,null,1)),sha:cur.sha,branch:'main'})})
  }).then(function(r){if(r.status===401||r.status===403)throw{auth:1};if(!r.ok)throw{code:r.status};
    DATA=JSON.parse(JSON.stringify(draft));dirty=false;b.disabled=false;status('Publicado. Las visitas lo verán en uno o dos minutos.','ok')
  }).catch(function(e){b.disabled=false;
    if(e&&e.auth){setTok('');showLogin('La clave venció o no tiene permiso. Ingresa una nueva.')}
    else if(e&&e.code===409)status('Alguien publicó al mismo tiempo. Vuelve a presionar Publicar.','bad');
    else if(e&&e.code===413||e&&e.code===422)status('El contenido quedó muy pesado. Usa fotos más livianas.','bad');
    else status('No se pudo publicar. Revisa tu conexión e inténtalo de nuevo.','bad')})}

/* Evangelio del día */
var COLORS={verde:'#3f7d4a',blanco:'#ffffff',morado:'#6a3d8f',rojo:'#b3261e',rosado:'#d98aa8',negro:'#222222'};
function santiagoDate(){try{return new Date().toLocaleDateString('en-CA',{timeZone:'America/Santiago'})}catch(e){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}}
function fechaLarga(){try{var t=new Date().toLocaleDateString('es-CL',{timeZone:'America/Santiago',weekday:'long',day:'numeric',month:'long'});return t.charAt(0).toUpperCase()+t.slice(1)}catch(e){return ''}}
$('ev-fecha').textContent='Evangelio del día · '+fechaLarga();
function showGospel(g){if(!g||g.fecha!==santiagoDate())return;
  if(g.cita)$('ev-cita').textContent=g.cita;
  if(g.celebracion)$('ev-celtxt').textContent=g.celebracion;
  var c=String(g.color||'').toLowerCase().split(/\s|,/)[0];var dot=$('ev-dot');if(COLORS[c]){dot.style.background=COLORS[c];dot.hidden=false;dot.title='Color litúrgico: '+g.color}
  if(g.resumen){$('ev-res').textContent=g.resumen;$('ev-res').hidden=false}
  var u=safeUrl(g.url);if(u)$('ev-link').href=u}
fetch('evangelio.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(showGospel).catch(function(){});
