name: Evangelio del día

on:
  schedule:
    # 08:43 y 10:43 UTC (madrugada en Chile), por si la página publica tarde
    - cron: '43 8 * * *'
    - cron: '43 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node evangelio.mjs
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain evangelio.json)" ]; then
            git config user.name "Evangelio diario"
            git config user.email "actions@users.noreply.github.com"
            git add evangelio.json
            git commit -m "Evangelio del día $(TZ=America/Santiago date +%F)"
            git push
          fi
